apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentguard-api
  namespace: agentguard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agentguard-api
  template:
    metadata:
      labels:
        app: agentguard-api
    spec:
      serviceAccountName: agentguard-sa
      containers:
      - name: api
        image: agentguard-api:latest # Will be built locally or pushed to registry
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: agentguard-config
        - secretRef:
            name: agentguard-secrets
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /live
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10

