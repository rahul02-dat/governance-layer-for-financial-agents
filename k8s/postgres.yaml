apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agentguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom:
        - secretRef:
            name: agentguard-secrets
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - agentguard
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - agentguard
          initialDelaySeconds: 5
          periodSeconds: 10
        # NOTE: Not production-ready, missing PV/PVC.
